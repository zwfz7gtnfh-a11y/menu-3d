<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plat Test en 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Layout : une fiche de plat, le plat en grand, puis nom, prix, description, allergènes */
:root {
  --bg: #f6f7f4; --surface: #ffffff; --fg: #1d221e; --muted: #5f6a62;
  --line: #dfe4de; --accent: #2f7a4f; --accent-fg: #ffffff; --chip: #eaf3ed;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141815; --surface: #1c211d; --fg: #eef2ee; --muted: #9eaaa1;
    --line: #2d342f; --accent: #5cc189; --accent-fg: #0f1a13; --chip: #22302a; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body);
  font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
}
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.viewer { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; position: relative; }
model-viewer { width: 100%; height: min(58vh, 440px); background: transparent; --poster-color: transparent; }
.ar-btn {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 999px;
  font: 600 15px var(--body); padding: 12px 22px; cursor: pointer; white-space: nowrap;
  box-shadow: 0 6px 18px rgba(0,0,0,.18);
}
.ar-btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.5rem); line-height: 1.05; margin: 2px 0 0; text-wrap: balance; }
.price { font-family: var(--display); font-weight: 600; font-size: 1.6rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.desc { margin: 0; color: var(--fg); max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--chip); color: var(--fg); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.allergens { border-top: 1px solid var(--line); padding-top: 14px; font-size: 14px; color: var(--muted); }
.allergens b { color: var(--fg); font-weight: 600; }
footer { font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <div class="viewer">
    <model-viewer id="plat" src="plat-test.glb" alt="Le plat en 3D"
      ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
      camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1500"
      rotation-per-second="18deg" environment-image="neutral" tone-mapping="neutral"
      exposure="1.1" shadow-intensity="0.6" shadow-softness="1"
      camera-orbit="0deg 55deg auto" interaction-prompt="auto">
      <button slot="ar-button" class="ar-btn">Voir le plat sur ma table</button>
    </model-viewer>
  </div>

  <section>
    <div class="eyebrow">Plat du jour</div>
    <div class="head">
      <h1>Pommes de terre &amp; chorizo</h1>
      <div class="price">14 €</div>
    </div>
  </section>

  <p class="desc">Pommes de terre fondantes, rondelles de chorizo grillées, servies chaudes.</p>

  <div class="chips">
    <span class="chip">Portion généreuse</span>
    <span class="chip">Assiette de 29 cm</span>
    <span class="chip">Légèrement épicé</span>
  </div>

  <div class="allergens"><b>Allergènes :</b> à confirmer auprès du restaurant.</div>

  <footer>Touche le bouton vert pour voir le plat à taille réelle sur ta table.</footer>
</main>
</body>
</html>
